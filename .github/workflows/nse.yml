name: NSE Turnover Scanner

on:
  schedule:
    - cron: '30 2 * * 1-5'   # 08:00 IST
    - cron: '0 0 * * *'     # keep-alive run
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run NSE Turnover Scanner
      run: |
        python nse_turnover_scanner.py

    - name: Send Email
      run: |
        python ./send_mail.py

      env:
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
